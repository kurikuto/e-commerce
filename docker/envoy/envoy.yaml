# Envoy Proxy 設定ファイル
#
# gRPC-WebからgRPCへの変換を行います。
# ブラウザ（HTTP/1.1）からのgRPC-Web通信を、
# バックエンド（HTTP/2）のgRPCに変換します。

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # gRPC-Webリスナー
    - name: grpc_web_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: grpc_web

                # ルーティング設定
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ['*']
                      routes:
                        # カタログサービスへのルーティング
                        - match:
                            prefix: '/ecommerce.catalog.CatalogService'
                          route:
                            cluster: catalog_service
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s

                        # CORS preflight対応
                        - match:
                            prefix: '/'
                            headers:
                              - name: ':method'
                                exact_match: 'OPTIONS'
                          direct_response:
                            status: 200

                # フィルター設定
                http_filters:
                  # gRPC-Webフィルター（重要！）
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                  # CORSフィルター
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # ルーターフィルター（最後に配置）
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # クラスター定義（バックエンドサービス）
  clusters:
    - name: catalog_service
      connect_timeout: 5s
      type: LOGICAL_DNS
      # HTTP/2（gRPC）を使用
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}

      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: catalog_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Dockerネットワーク内のホスト名
                      # ローカル開発時はlocalhostまたはホストマシンのIPに変更
                      address: host.docker.internal
                      port_value: 50051

      # ヘルスチェック
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 2
          healthy_threshold: 2
          grpc_health_check: {}
